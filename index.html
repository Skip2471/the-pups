<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Pups</title>

  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fdeff6;
      color: #102a72;
    }

    header {
      background: #1428c8;
      color: white;
      text-align: center;
      padding: 45px 20px 55px;
      border-bottom-left-radius: 55px;
      border-bottom-right-radius: 55px;
    }

    header h1 {
      font-size: 48px;
      margin: 0;
      letter-spacing: 2px;
    }

    header p {
      font-size: 20px;
      margin-top: 10px;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .upload-box {
      background: white;
      padding: 25px;
      border-radius: 28px;
      box-shadow: 0 8px 25px rgba(20, 40, 200, 0.12);
      margin-bottom: 30px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
      margin-bottom: 8px;
    }

    input, select, button {
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      border: 2px solid #1428c8;
      font-size: 18px;
    }

    button {
      background: #1428c8;
      color: white;
      font-weight: bold;
      margin-top: 18px;
      cursor: pointer;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin: 30px 0;
    }

    .filters button {
      background: white;
      color: #1428c8;
      border: 3px solid #1428c8;
      border-radius: 22px;
    }

    .filters button.active {
      background: #1428c8;
      color: white;
    }

    .gallery {
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
    }

    .card {
      background: white;
      border-radius: 35px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(20, 40, 200, 0.12);
    }

    .card img {
      width: 100%;
      display: block;
    }

    .card-content {
      padding: 22px;
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 34px;
      color: #1428c8;
    }

    .card p {
      margin: 0;
      font-size: 24px;
      color: #444;
      line-height: 1.3;
      white-space: pre-wrap;
    }

    footer {
      text-align: center;
      padding: 45px 20px;
      font-size: 20px;
      color: #1428c8;
    }
  </style>
</head>

<body>
  <header>
    <h1>The Pups</h1>
    <p>Rocket and Luna’s photo gallery 🐶</p>
  </header>

  <main>
    <div class="upload-box">
      <label for="photoInput">Choose photo</label>
      <input type="file" id="photoInput" accept="image/*">

      <label for="categoryInput">Category</label>
      <select id="categoryInput">
        <option value="Rocket">Rocket</option>
        <option value="Luna">Luna</option>
        <option value="Both">Both</option>
      </select>

      <label for="captionInput">Caption</label>
      <input type="text" id="captionInput" placeholder="Add your caption">

      <button onclick="uploadPhoto()">Upload Photo</button>
    </div>

    <div class="filters">
      <button class="active" onclick="setFilter('All', this)">All</button>
      <button onclick="setFilter('Rocket', this)">Rocket</button>
      <button onclick="setFilter('Luna', this)">Luna</button>
      <button onclick="setFilter('Both', this)">Both</button>
    </div>

    <div id="gallery" class="gallery"></div>
  </main>

  <footer>
    Made with love for Rocket and Luna 🐶
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getStorage, ref, uploadBytes, getDownloadURL, listAll } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCAyLnLBfqSPMG1PgIsy8yIq9juj4_NCZo",
      authDomain: "the-pups.firebaseapp.com",
      projectId: "the-pups",
      storageBucket: "the-pups.firebasestorage.app",
      messagingSenderId: "19468512902",
      appId: "1:19468512902:web:582cbec77c9a04b390eb07"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const storage = getStorage(app);
    const db = getFirestore(app);

    let photos = [];
    let currentFilter = "All";

    await signInAnonymously(auth);
    await loadPhotos();

    window.uploadPhoto = async function () {
      const fileInput = document.getElementById("photoInput");
      const categoryInput = document.getElementById("categoryInput");
      const captionInput = document.getElementById("captionInput");

      const file = fileInput.files[0];

      if (!file) {
        alert("Please choose a photo first.");
        return;
      }

      const category = categoryInput.value;
      const caption = captionInput.value.trim();

      const fileName = Date.now() + "-" + file.name;
      const storageRef = ref(storage, "photos/" + fileName);

      await uploadBytes(storageRef, file);
      const imageUrl = await getDownloadURL(storageRef);

      await addDoc(collection(db, "photos"), {
        imageUrl: imageUrl,
        category: category,
        caption: caption,
        createdAt: Date.now()
      });

      fileInput.value = "";
      captionInput.value = "";

      await loadPhotos();
    };

    async function loadPhotos() {
      photos = [];

      const q = query(collection(db, "photos"), orderBy("createdAt", "desc"));
      const snapshot = await getDocs(q);

      snapshot.forEach((doc) => {
        photos.push(doc.data());
      });

      renderGallery();
    }

    function renderGallery() {
      const gallery = document.getElementById("gallery");
      gallery.innerHTML = "";

      const filteredPhotos = currentFilter === "All"
        ? photos
        : photos.filter(photo => photo.category === currentFilter);

      filteredPhotos.forEach(photo => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <img src="${photo.imageUrl}" alt="${photo.category}">
          <div class="card-content">
            <h2>${photo.category}</h2>
            ${photo.caption ? `<p>${photo.caption}</p>` : ""}
          </div>
        `;

        gallery.appendChild(card);
      });
    }

    window.setFilter = function (filter, button) {
      currentFilter = filter;

      document.querySelectorAll(".filters button").forEach(btn => {
        btn.classList.remove("active");
      });

      button.classList.add("active");
      renderGallery();
    };
  </script>
</body>
</html>
