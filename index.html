<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Pups</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
body{margin:0;font-family:Arial,sans-serif;background:#fdeff6;color:#102a72}
header{background:#1428c8;color:white;text-align:center;padding:55px 20px 65px;border-bottom-left-radius:60px;border-bottom-right-radius:60px}
header h1{font-size:54px;margin:0}
header p{font-size:22px;margin-top:20px}
.container{max-width:1000px;margin:35px auto;padding:0 20px}
.upload{background:white;padding:20px;border-radius:28px;margin-bottom:30px}
input,select,button{width:100%;padding:15px;margin:8px 0;border-radius:20px;border:3px solid #1428c8;font-size:18px}
button{background:white;color:#1428c8;font-weight:bold}
button.active{background:#1428c8;color:white}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:35px}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:40px}
.card{background:white;border-radius:28px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.card img{width:100%;height:340px;object-fit:cover;display:block}
.card-content{padding:25px}
.card-content h2{margin:0 0 12px;color:#1428c8;font-size:30px}
.card-content p{margin:0;color:#444;font-size:22px}
footer{text-align:center;padding:35px;color:#1428c8;font-size:18px}
@media(max-width:700px){.buttons{grid-template-columns:repeat(2,1fr)}.gallery{grid-template-columns:1fr}.card img{height:320px}}
</style>
</head>

<body>
<header>
<h1>🐾 The Pups</h1>
<p>Rocket & Luna’s family photo album</p>
</header>

<main class="container">

<div class="upload">
<h2>Add a Photo</h2>
<input type="file" id="photoInput" accept="image/*">
<select id="albumInput">
<option value="Rocket">Rocket</option>
<option value="Luna">Luna</option>
<option value="Both">Both</option>
</select>
<input type="text" id="captionInput" placeholder="Caption">
<button onclick="uploadPhoto()">Upload Photo</button>
<p id="status"></p>
</div>

<div class="buttons">
<button class="active" onclick="filterGallery('all', this)">All</button>
<button onclick="filterGallery('rocket', this)">Rocket</button>
<button onclick="filterGallery('luna', this)">Luna</button>
<button onclick="filterGallery('both', this)">Both</button>
</div>

<section class="gallery" id="gallery"></section>
</main>

<footer>Made with love for Rocket and Luna 🐶</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getStorage, ref, uploadBytes, getDownloadURL, listAll } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyCAyLnLBfqSPMG1PgIsy8yIq9juj4_NCZo",
  authDomain: "the-pups.firebaseapp.com",
  projectId: "the-pups",
  storageBucket: "the-pups.firebasestorage.app",
  messagingSenderId: "19468512902",
  appId: "1:19468512902:web:582cbec77c9a04b390eb07"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const storage = getStorage(app);

let currentFilter = "all";
let allPhotos = [];

await signInAnonymously(auth);
loadPhotos();

window.uploadPhoto = async function() {
  const file = document.getElementById("photoInput").files[0];
  const album = document.getElementById("albumInput").value;
  const caption = document.getElementById("captionInput").value || `${album} photo`;
  const status = document.getElementById("status");

  if (!file) {
    status.innerText = "Choose a photo first.";
    return;
  }

  status.innerText = "Uploading...";

  const safeCaption = caption.replace(/[^a-z0-9]/gi, "_");
  const fileName = `${Date.now()}_${safeCaption}_${file.name}`;
  const photoRef = ref(storage, `photos/${album}/${fileName}`);

  await uploadBytes(photoRef, file);

  status.innerText = "Uploaded!";
  document.getElementById("photoInput").value = "";
  document.getElementById("captionInput").value = "";

  loadPhotos();
};

async function loadPhotos() {
  allPhotos = [];

  for (const album of ["Rocket", "Luna", "Both"]) {
    const folderRef = ref(storage, `photos/${album}`);
    const result = await listAll(folderRef);

    for (const item of result.items) {
      const url = await getDownloadURL(item);
      const parts = item.name.split("_");
      const caption = parts.slice(1, -1).join(" ").replaceAll("_", " ");

      allPhotos.push({
        url,
        album,
        category: album.toLowerCase(),
        caption: caption || `${album} photo`
      });
    }
  }

  showPhotos();
}

window.filterGallery = function(category, buttonClicked) {
  currentFilter = category;
  document.querySelectorAll(".buttons button").forEach(button => button.classList.remove("active"));
  buttonClicked.classList.add("active");
  showPhotos();
};

function showPhotos() {
  const gallery = document.getElementById("gallery");
  gallery.innerHTML = "";

  allPhotos
    .filter(photo => currentFilter === "all" || photo.category === currentFilter)
    .forEach(photo => {
      gallery.innerHTML += `
        <div class="card ${photo.category}">
          <img src="${photo.url}" alt="${photo.caption}">
          <div class="card-content">
            <h2>${photo.album}</h2>
            <p>${photo.caption}</p>
          </div>
        </div>
      `;
    });
}
</script>
</body>
</html>
