<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Pups</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fdeff6;
      color: #102a72;
    }

    header {
      background: linear-gradient(#7f7cf0, #1428c8);
      color: white;
      text-align: center;
      padding: 55px 20px 45px;
      border-bottom-left-radius: 55px;
      border-bottom-right-radius: 55px;
    }

    header h1 { font-size: 48px; margin: 0; }
    header p { font-size: 20px; }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .box, .card {
      background: white;
      border-radius: 35px;
      box-shadow: 0 8px 25px rgba(20, 40, 200, 0.12);
    }

    .box {
      padding: 25px;
      margin-bottom: 30px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
      margin-bottom: 8px;
      font-size: 20px;
    }

    input, select, button {
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      border: 2px solid #1428c8;
      font-size: 18px;
    }

    button {
      background: #1428c8;
      color: white;
      font-weight: bold;
      margin-top: 14px;
      cursor: pointer;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 30px 0;
    }

    .filters button {
      background: white;
      color: #1428c8;
      border: 3px solid #1428c8;
      border-radius: 22px;
    }

    .filters button.active {
      background: #1428c8;
      color: white;
    }

    .gallery {
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
    }

    .card {
      overflow: hidden;
    }

    .card img {
      width: 100%;
      display: block;
    }

    .card-content {
      padding: 22px;
    }

    .caption {
      margin: 0;
      font-size: 28px;
      line-height: 1.3;
      font-weight: bold;
    }

    .Rocket { color: #1428c8; }
    .Luna { color: #ff69b4; }
    .Both { color: #222; }
    .Other { color: #444; }

    .small-btn {
      font-size: 16px;
      padding: 12px;
    }

    .delete-btn { background: #d93025; border: none; }
    .fav-btn { background: #ff69b4; border: none; }
    .edit-btn { background: #1428c8; border: none; }

    #status {
      margin-top: 15px;
      font-size: 18px;
      color: #d93025;
      font-weight: bold;
    }

    #slideshow {
      display: none;
      position: fixed;
      inset: 0;
      background: black;
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #slideImg {
      max-width: 100%;
      max-height: 82%;
      object-fit: contain;
    }

    #slideCaption {
      color: white;
      font-size: 28px;
      padding: 20px;
      text-align: center;
    }

    #closeSlide {
      position: fixed;
      top: 25px;
      right: 20px;
      width: auto;
      padding: 12px 18px;
      background: #d93025;
      border: none;
    }

    footer {
      text-align: center;
      padding: 45px 20px;
      font-size: 20px;
      color: #1428c8;
    }
  </style>
</head>

<body>
  <header>
    <h1>The Pups</h1>
    <p>Rocket and Luna’s photo gallery 🐶</p>
  </header>

  <main>
    <div class="box">
      <label>Choose photo</label>
      <input type="file" id="photoInput" accept="image/*">

      <label>Category</label>
      <select id="categoryInput">
        <option value="Rocket">Rocket</option>
        <option value="Luna">Luna</option>
        <option value="Both">Both</option>
        <option value="Favorites">Favorites</option>
        <option value="Holiday">Holiday</option>
        <option value="Funny">Funny</option>
        <option value="Family">Family</option>
      </select>

      <label>Caption</label>
      <input type="text" id="captionInput" placeholder="Add your caption">

      <button id="uploadBtn">Upload Photo</button>
      <button onclick="startSlideshow()">Start Slideshow</button>
      <div id="status"></div>
    </div>

    <div class="filters">
      <button class="active" onclick="setFilter('All', this)">All</button>
      <button onclick="setFilter('Rocket', this)">Rocket</button>
      <button onclick="setFilter('Luna', this)">Luna</button>
      <button onclick="setFilter('Both', this)">Both</button>
      <button onclick="setFilter('Favorites', this)">Favorites</button>
      <button onclick="setFilter('Holiday', this)">Holiday</button>
      <button onclick="setFilter('Funny', this)">Funny</button>
      <button onclick="setFilter('Family', this)">Family</button>
    </div>

    <div id="gallery" class="gallery"></div>
  </main>

  <footer>
    Made with love for Rocket and Luna 🐶
  </footer>

  <div id="slideshow">
    <button id="closeSlide" onclick="closeSlideshow()">Close</button>
    <img id="slideImg">
    <div id="slideCaption"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getStorage, ref, uploadBytes, getDownloadURL, listAll,
      getMetadata, deleteObject, updateMetadata
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCAyLnLBfqSPMG1PgIsy8yIq9juj4_NCZo",
      authDomain: "the-pups.firebaseapp.com",
      projectId: "the-pups",
      storageBucket: "the-pups.firebasestorage.app",
      messagingSenderId: "19468512902",
      appId: "1:19468512902:web:582cbec77c9a04b390eb07"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const storage = getStorage(app);

    let photos = [];
    let currentFilter = "All";
    let slideIndex = 0;
    let slideTimer = null;

    const status = document.getElementById("status");
    const uploadBtn = document.getElementById("uploadBtn");

    await signInAnonymously(auth);
    await loadPhotos();

    function cleanCaption(caption) {
      if (!caption) return "";
      return caption
        .replace(/\sIMG$/i, "")
        .replace(/\sIMG_\d+$/i, "")
        .replace(/\sJPG$/i, "")
        .replace(/\sJPEG$/i, "")
        .trim();
    }

    function escapeHTML(text) {
      return String(text || "").replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[m]));
    }

    uploadBtn.addEventListener("click", async () => {
      const file = document.getElementById("photoInput").files[0];
      const category = document.getElementById("categoryInput").value;
      const caption = document.getElementById("captionInput").value.trim();

      if (!file) {
        alert("Please choose a photo first.");
        return;
      }

      try {
        uploadBtn.disabled = true;
        uploadBtn.textContent = "Uploading...";

        const filePath = "photos/" + Date.now() + "-" + file.name;
        const fileRef = ref(storage, filePath);

        await uploadBytes(fileRef, file, {
          customMetadata: {
            category,
            caption,
            favorite: "false"
          }
        });

        document.getElementById("photoInput").value = "";
        document.getElementById("captionInput").value = "";

        await loadPhotos();

        uploadBtn.disabled = false;
        uploadBtn.textContent = "Upload Photo";
      } catch (error) {
        status.textContent = "Upload failed: " + error.message;
        uploadBtn.disabled = false;
        uploadBtn.textContent = "Upload Photo";
      }
    });

    async function loadPhotos() {
      photos = [];
      const result = await listAll(ref(storage, "photos"));

      for (const itemRef of result.items) {
        const url = await getDownloadURL(itemRef);
        const metadata = await getMetadata(itemRef);

        photos.push({
          url,
          fullPath: itemRef.fullPath,
          name: itemRef.name,
          category: metadata.customMetadata?.category || "Both",
          caption: cleanCaption(metadata.customMetadata?.caption || ""),
          favorite: metadata.customMetadata?.favorite === "true"
        });
      }

      photos.sort((a, b) => b.name.localeCompare(a.name));
      renderGallery();
    }

    function getFilteredPhotos() {
      if (currentFilter === "All") return photos;
      if (currentFilter === "Favorites") return photos.filter(p => p.favorite);
      return photos.filter(p => p.category === currentFilter);
    }

    function renderGallery() {
      const gallery = document.getElementById("gallery");
      gallery.innerHTML = "";

      getFilteredPhotos().forEach(photo => {
        const colorClass = ["Rocket", "Luna", "Both"].includes(photo.category)
          ? photo.category
          : "Other";

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <img src="${photo.url}" alt="">
          <div class="card-content">
            ${photo.caption ? `<p class="caption ${colorClass}">${escapeHTML(photo.caption)}</p>` : ""}
            <button class="fav-btn small-btn" onclick="toggleFavorite('${photo.fullPath}', '${photo.favorite}')">
              ${photo.favorite ? "Remove Favorite" : "Add Favorite"}
            </button>
            <button class="edit-btn small-btn" onclick="editCaption('${photo.fullPath}', \`${escapeHTML(photo.caption)}\`)">
              Edit Caption
            </button>
            <button class="delete-btn small-btn" onclick="deletePhoto('${photo.fullPath}')">
              Delete Photo
            </button>
          </div>
        `;

        gallery.appendChild(card);
      });
    }

    window.toggleFavorite = async function(fullPath, currentValue) {
      const newValue = currentValue !== "true";
      const fileRef = ref(storage, fullPath);
      const oldMeta = await getMetadata(fileRef);

      await updateMetadata(fileRef, {
        customMetadata: {
          ...oldMeta.customMetadata,
          favorite: String(newValue)
        }
      });

      await loadPhotos();
    };

    window.editCaption = async function(fullPath, oldCaption) {
      const newCaption = prompt("Edit caption:", oldCaption);
      if (newCaption === null) return;

      const fileRef = ref(storage, fullPath);
      const oldMeta = await getMetadata(fileRef);

      await updateMetadata(fileRef, {
        customMetadata: {
          ...oldMeta.customMetadata,
          caption: newCaption.trim()
        }
      });

      await loadPhotos();
    };

    window.deletePhoto = async function(fullPath) {
      if (!confirm("Delete this photo?")) return;
      await deleteObject(ref(storage, fullPath));
      await loadPhotos();
    };

    window.setFilter = function(filter, button) {
      currentFilter = filter;
      document.querySelectorAll(".filters button").forEach(btn => btn.classList.remove("active"));
      button.classList.add("active");
      renderGallery();
    };

    window.startSlideshow = function() {
      const slides = getFilteredPhotos();
      if (slides.length === 0) {
        alert("No photos to show.");
        return;
      }

      document.getElementById("slideshow").style.display = "flex";
      slideIndex = 0;

      function showSlide() {
        const photo = slides[slideIndex];
        document.getElementById("slideImg").src = photo.url;
        document.getElementById("slideCaption").textContent = photo.caption || "";
        slideIndex = (slideIndex + 1) % slides.length;
      }

      showSlide();
      slideTimer = setInterval(showSlide, 10000);
    };

    window.closeSlideshow = function() {
      document.getElementById("slideshow").style.display = "none";
      clearInterval(slideTimer);
    };
  </script>
</body>
</html>
